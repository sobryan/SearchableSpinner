apply plugin: 'com.android.library'
apply plugin: 'maven-publish'
apply plugin: 'signing'

ext {
    publishedGroupId = 'com.toptoche.searchablespinner'
    libraryName = 'SearchableSpinner'
    artifact = 'searchablespinnerlibrary'

    libraryDescription = 'A simple spinner with an extra functionality of searching the items in the spinner.'

    siteUrl = 'https://github.com/sobryan/SearchableSpinner'
    gitUrl = 'https://github.com/sobryan/SearchableSpinner.git'

    libraryVersion = '1.3.2'

    developerId = 'sobryan'
    developerName = 'SearchableSpinner Contributors'
    developerEmail = 'info@example.com'

    licenseName = 'The Apache Software License, Version 2.0'
    licenseUrl = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
    allLicenses = ["Apache-2.0"]
}

android {
    namespace 'com.toptoche.searchablespinnerlibrary'
    compileSdk 34

    defaultConfig {
        minSdk 15
        targetSdk 34
        versionCode 9
        versionName "1.3.2"
    }
    
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // AndroidX dependencies
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.fragment:fragment:1.6.2'
}

// Task to generate sources JAR
task androidSourcesJar(type: Jar) {
    archiveClassifier.set('sources')
    from android.sourceSets.main.java.srcDirs
}

// Task to generate Javadoc
task androidJavadocs(type: Javadoc) {
    source = android.sourceSets.main.java.srcDirs
    classpath += project.files(android.getBootClasspath().join(File.pathSeparator))
    excludes = ['**/*.kt']
    options.encoding = 'UTF-8'
    failOnError false
}

// Task to generate Javadoc JAR
task androidJavadocsJar(type: Jar, dependsOn: androidJavadocs) {
    archiveClassifier.set('javadoc')
    from androidJavadocs.destinationDir
}

// Maven Central publishing configuration
afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                
                groupId = publishedGroupId
                artifactId = artifact
                version = libraryVersion
                
                artifact androidSourcesJar
                artifact androidJavadocsJar
                
                pom {
                    name = libraryName
                    description = libraryDescription
                    url = siteUrl
                    
                    licenses {
                        license {
                            name = licenseName
                            url = licenseUrl
                        }
                    }
                    
                    developers {
                        developer {
                            id = developerId
                            name = developerName
                            email = developerEmail
                        }
                    }
                    
                    scm {
                        connection = "scm:git:${gitUrl}"
                        developerConnection = "scm:git:${gitUrl}"
                        url = siteUrl
                    }
                }
            }
        }
        
        repositories {
            maven {
                name = "sonatype"
                url = version.endsWith('SNAPSHOT') ? 
                    "https://s01.oss.sonatype.org/content/repositories/snapshots/" :
                    "https://s01.oss.sonatype.org/service/local/staging/deploy/maven2/"
                credentials {
                    username = findProperty("ossrhUsername") ?: System.getenv("OSSRH_USERNAME")
                    password = findProperty("ossrhPassword") ?: System.getenv("OSSRH_PASSWORD")
                }
            }
        }
    }
}

// Signing configuration for Maven Central
signing {
    // Use GPG agent or in-memory keys
    def signingKey = findProperty("signingKey") ?: System.getenv("SIGNING_KEY")
    def signingPassword = findProperty("signingPassword") ?: System.getenv("SIGNING_PASSWORD")
    
    if (signingKey && signingPassword) {
        useInMemoryPgpKeys(signingKey, signingPassword)
    }
    
    sign publishing.publications
}